name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Une seule exécution active par PR ou branche : un nouveau push annule la précédente.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Installation
        run: pnpm install --frozen-lockfile
      - name: Typecheck, lint, tests unitaires et build
        run: pnpm validate
      # Google Chrome est préinstallé sur les runners ubuntu-24.04 : aucun téléchargement de navigateur.
      - name: Test E2E de fumée
        run: pnpm test:smoke
      - name: Rapport Playwright en cas d'échec
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
